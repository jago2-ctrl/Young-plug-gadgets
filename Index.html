function makePhone(brand, idx, row) {
  const [name, year, price, chip, display, camera, storages, colors, comingSoon] = row;
  const stock = comingSoon ? 0 : seededStock(idx, idx % 11 === 0);
  return {
    id: `smartphones-${brand.toLowerCase()}-${idx}`,
    slug: slugify(name),
    name, brand, categoryId: "smartphones", year, price,
    storageOptions: storages, colorOptions: colors,
    rating: seededRating(idx), reviews: seededReviews(idx), stock,
    isNew: year >= 2024 && !comingSoon, isComingSoon: !!comingSoon,
    specs: {
      Display: display, Chip: chip, Camera: camera, Storage: storages.join(" / "),
      Battery: year >= 2022 ? "Up to 26h video playback" : "Up to 20h video playback",
      Warranty: comingSoon ? "Available for pre-order" : "12 Months Limited Warranty",
    },
    description: `${name} brings ${chip} performance to a ${display.split(",")[0]} display, available from ${storages[0]} up to ${storages[storages.length - 1]}.`,
  };
}

function makeConsole(idx, row) {
  const [name, year, price, chip, storage, extra] = row;
  return {
    id: `gaming-${idx}`, slug: slugify(name), name, brand: "Sony", categoryId: "gaming", year, price,
    storageOptions: [storage.split(",")[0].trim()], colorOptions: ["Jet Black", "White"],
    rating: seededRating(idx + 5), reviews: seededReviews(idx + 5), stock: seededStock(idx + 30, false),
    isNew: year >= 2020,
    specs: { Processor: chip, Storage: storage, Highlight: extra, Warranty: "12 Months Limited Warranty" },
    description: `${name} — ${extra}.`,
  };
}

function Stars({ value, size = 14 }) {
  return (
    <div className="flex items-center gap-0.5">
      {[1, 2, 3, 4, 5].map((i) => (
        <Star key={i} size={size} style={{ color: C.brown }} fill={i <= Math.round(value) ? C.brown : "none"} strokeWidth={1.5} />
      ))}
    </div>
  );
}

function Button({ children, onClick, variant = "solid", className = "", icon: Icon, type = "button", disabled, fullWidth }) {
  const base = "inline-flex items-center justify-center gap-2 px-6 py-3 text-sm font-semibold rounded-2xl transition-all duration-300";
  const style =
    variant === "solid"
      ? { background: `linear-gradient(135deg, ${C.brownLight}, ${C.brown} 70%, ${C.brownDark})`, color: "#fff", boxShadow: "0 8px 20px rgba(107,66,38,0.25)" }
      : variant === "outline"
      ? { border: `1.5px solid ${C.brown}`, color: C.brown, background: "transparent" }
      : variant === "ghost"
      ? { color: C.brown, background: C.surfaceAlt }
      : { color: C.text, background: "transparent" };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      className={base + (fullWidth ? " w-full" : "") + (disabled ? " opacity-40" : " hover:scale-[1.02] active:scale-[0.98]") + " " + className}
      style={style}
    >
      {Icon && <Icon size={16} />}
      {children}
    </button>
  );
}

function Badge({ children, tone = "brown" }) {
  const tones = {
    brown: { background: C.brown, color: "#fff" },
    danger: { background: C.danger, color: "#fff" },
    success: { border: `1px solid ${C.success}`, color: C.success, background: "#fff" },
    warning: { border: `1px solid ${C.warning}`, color: C.warning, background: "#fff" },
  };
  return (
    <span className="text-[10px] uppercase tracking-wider px-2 py-1 font-bold rounded-full" style={tones[tone]}>
      {children}
    </span>
  );
}

function SectionHeading({ eyebrow, title, sub }) {
  return (
    <div className="mb-8 md:mb-10">
      {eyebrow && (
        <div className="text-xs uppercase tracking-[0.2em] mb-2 font-semibold" style={{ color: C.brownLight }}>{eyebrow}</div>
      )}

      {sub && <p className="mt-2 max-w-xl text-sm md:text-base" style={{ color: C.muted }}>{sub}</p>}

  );
}

function ProductArt({ product, big = false, zoom = false }) {
  const cat = CATEGORIES.find((c) => c.id === product.categoryId);
  const Icon = cat ? cat.icon : Smartphone;
  const outOfStock = product.stock === 0 && !product.isComingSoon;
  return (
    <div
      className="relative w-full flex items-center justify-center overflow-hidden rounded-2xl"
      style={{ aspectRatio: "1 / 1", background: `radial-gradient(circle at 50% 35%, ${C.surfaceAlt} 0%, #EFE2D2 60%, #E6D5BE 100%)`, border: `1px solid ${C.border}` }}
    >
      <div className="absolute rounded-full" style={{ width: big ? 220 : 130, height: big ? 220 : 130, border: `1px solid ${C.brownLight}55`, boxShadow: `0 0 50px ${C.brownLight}33` }} />
      <Icon
        size={big ? 110 : 60}
        strokeWidth={1.1}
        className={zoom ? "transition-transform duration-500 group-hover:scale-110" : ""}
        style={{ color: C.brown }}
      />
      <div className="absolute top-3 left-3 flex flex-col gap-1.5">
        {product.isNew && <Badge tone="brown">New</Badge>}
        {product.isComingSoon && <Badge tone="warning">Coming Soon</Badge>}
      </div>
      {outOfStock && (
        <div className="absolute inset-0 flex items-center justify-center" style={{ background: "rgba(43,27,18,0.55)" }}>
          <span className="text-xs uppercase tracking-wider font-bold px-3 py-1.5 rounded-full" style={{ background: "#fff", color: C.danger }}>
            Out of Stock
          </span>
        </div>
      )}
    </div>
  );
}

/*  PRODUCT CARD                                                           */

function ProductCard({ product, onView, onAdd, wishlist, toggleWishlist }) {
  const isWished = wishlist.has(product.id);
  const unavailable = product.stock === 0;
  return (
    <div className="group flex flex-col cursor-pointer rounded-2xl overflow-hidden transition-transform hover:-translate-y-1"
      style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: "0 4px 16px rgba(107,66,38,0.06)" }}
      onClick={() => onView(product.id)}
    >
      <div className="relative p-3">
        <ProductArt product={product} zoom />
        <button onClick={(e) => { e.stopPropagation(); toggleWishlist(product.id); }} className="absolute bottom-5 right-5 p-2 rounded-full" style={{ background: "#fff", border: `1px solid ${C.border}` }}>
          <Heart size={15} style={{ color: isWished ? C.brown : C.muted }} fill={isWished ? C.brown : "none"} />
        </button>
      </div>
      <div className="px-4 pb-4 flex flex-col gap-1 flex-1">
        <span className="text-[11px] uppercase tracking-wider" style={{ color: C.muted }}>{product.brand}</span>
        <h3 className="text-sm font-medium leading-snug" style={{ color: C.text }}>{product.name}</h3>
        <div className="flex items-center gap-2 mt-1">
          <Stars value={product.rating} />
          <span className="text-xs" style={{ color: C.muted }}>({product.reviews})</span>
        </div>
        <div className="mt-1 text-base font-bold" style={{ color: C.brown }}>{naira(product.price)}</div>
        <button
          disabled={unavailable}
          onClick={(e) => { e.stopPropagation(); onAdd(product.id); }}
          className="mt-3 w-full text-xs uppercase tracking-wider font-semibold py-2.5 rounded-xl transition-colors"
          style={unavailable ? { background: C.surfaceAlt, color: C.muted } : { border: `1.5px solid ${C.brown}`, color: C.brown, background: "transparent" }}
        >
          {unavailable ? (product.isComingSoon ? "Coming Soon" : "Out of Stock") : "Add to Cart"}
        </button>
      </div>
    </div>
  );
}

function ShopPage({ initialCategory, viewProduct, addToCart, wishlist, toggleWishlist, searchTerm }) {
  const [category, setCategory] = useState(initialCategory || null);
  const [brand, setBrand] = useState(new Set());
  const [storage, setStorage] = useState(new Set());
  const [color, setColor] = useState(new Set());
  const [maxPrice, setMaxPrice] = useState(2000000);
  const [sort, setSort] = useState("popularity");
  const [search, setSearch] = useState(searchTerm || "");
  const [filtersOpen, setFiltersOpen] = useState(false);

  const toggleSet = (setter) => (val) => setter((prev) => { const n = new Set(prev); n.has(val) ? n.delete(val) : n.add(val); return n; });

  const filtered = useMemo(() => {
    let list = PRODUCTS.filter((p) => p.price <= maxPrice);
    if (category) list = list.filter((p) => p.categoryId === category);
    if (brand.size) list = list.filter((p) => brand.has(p.brand));
    if (storage.size) list = list.filter((p) => (p.storageOptions || []).some((s) => storage.has(s)));
    if (color.size) list = list.filter((p) => (p.colorOptions || []).some((c) => color.has(c)));
    if (search) { const q = search.toLowerCase(); list = list.filter((p) => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q)); }
    const sorted = [...list];
    if (sort === "price-asc") sorted.sort((a, b) => a.price - b.price);
    if (sort === "price-desc") sorted.sort((a, b) => b.price - a.price);
    if (sort === "newest") sorted.sort((a, b) => (b.year || 0) - (a.year || 0));
    if (sort === "popularity") sorted.sort((a, b) => b.reviews - a.reviews);
    return sorted;
  }, [category, brand, storage, color, maxPrice, search, sort]);

  const FiltersPanel = () => (
    <div className="space-y-7">
      <div>
        <h4 className="text-xs uppercase tracking-wider mb-3" style={{ color: C.brown }}>Category</h4>
        <div className="space-y-2">
          <button onClick={() => setCategory(null)} className="text-sm block" style={{ color: !category ? C.brown : C.muted }}>All Categories</button>
          {CATEGORIES.map((c) => <button key={c.id} onClick={() => setCategory(c.id)} className="text-sm block" style={{ color: category === c.id ? C.brown : C.muted }}>{c.name}</button>)}
        </div>
      </div>
      <div>
        <h4 className="text-xs uppercase tracking-wider mb-3" style={{ color: C.brown }}>Brand</h4>
        <div className="space-y-2 max-h-32 overflow-y-auto pr-1">
          {BRANDS.map((b) => (
            <label key={b} className="flex items-center gap-2 text-sm cursor-pointer" style={{ color: C.muted }}>
              <input type="checkbox" checked={brand.has(b)} onChange={() => toggleSet(setBrand)(b)} /> {b}
            </label>
          ))}
        </div>
      </div>
      <div>
        <h4 className="text-xs uppercase tracking-wider mb-3" style={{ color: C.brown }}>Storage</h4>
        <div className="flex flex-wrap gap-2">
          {ALL_STORAGES.map((s) => (
            <button key={s} onClick={() => toggleSet(setStorage)(s)} className="text-xs px-3 py-1.5 rounded-full" style={storage.has(s) ? { background: C.brown, color: "#fff" } : { border: `1px solid ${C.border}`, color: C.muted }}>{s}</button>
          ))}
        </div>
      </div>
      <div>
        <h4 className="text-xs uppercase tracking-wider mb-3" style={{ color: C.brown }}>Colour</h4>
        <div className="flex flex-wrap gap-2">
          {ALL_COLORS.slice(0, 14).map((c) => (
            <button key={c} onClick={() => toggleSet(setColor)(c)} className="text-xs px-3 py-1.5 rounded-full" style={color.has(c) ? { background: C.brown, color: "#fff" } : { border: `1px solid ${C.border}`, color: C.muted }}>{c}</button>
          ))}
        </div>
      </div>
      <div>
        <h4 className="text-xs uppercase tracking-wider mb-3" style={{ color: C.brown }}>Max Price: {naira(maxPrice)}</h4>
        <input type="range" min={5000} max={2000000} step={5000} value={maxPrice} onChange={(e) => setMaxPrice(Number(e.target.value))} className="w-full" />
      </div>
    </div>
  );

  return (
    <div className="max-w-7xl mx-auto px-4 md:px-8 py-10">
      <SectionHeading eyebrow="Catalog" title="Shop All Gadgets" sub={`${filtered.length} products found`} />
      <div className="flex flex-col md:flex-row gap-8">
        <aside className="hidden md:block w-64 shrink-0"><FiltersPanel /></aside>
        <div className="flex-1">

/* ---------------------------------------------------------------------- */
/*  PRODUCT DETAILS PAGE                                                   */
/* ---------------------------------------------------------------------- */
function ProductPage({ productId, viewProduct, addToCart, onBuyNow, wishlist, toggleWishlist }) {
  const product = PRODUCTS.find((p) => p.id === productId) || PRODUCTS[0];
  const [zoom, setZoom] = useState(false);
  const [activeView, setActiveView] = useState(0);
  const [storageChoice, setStorageChoice] = useState((product.storageOptions || [])[0]);
  const [colorChoice, setColorChoice] = useState((product.colorOptions || [])[0]);
  const [qty, setQty] = useState(1);
  const views = ["Front", "Back", "Side", "Detail"];
  const related = PRODUCTS.filter((p) => p.categoryId === product.categoryId && p.id !== product.id).slice(0, 4);
  const unavailable = product.stock === 0;

  useEffect(() => { setActiveView(0); setQty(1); setStorageChoice((product.storageOptions || [])[0]); setColorChoice((product.colorOptions || [])[0]); }, [productId]);

  return (
    <div className="max-w-7xl mx-auto px-4 md:px-8 py-10">
      <div className="grid md:grid-cols-2 gap-10">
        <div>
          <div onMouseEnter={() => setZoom(true)} onMouseLeave={() => setZoom(false)} className="group">
            <ProductArt product={product} big zoom />
          </div>
          <div className="flex gap-3 mt-4">
            {views.map((v, i) => (
              <button key={v} onClick={() => setActiveView(i)} className="flex-1 py-2 text-xs uppercase tracking-wider rounded-xl" style={{ border: `1px solid ${activeView === i ? C.brown : C.border}`, color: activeView === i ? C.brown : C.muted }}>{v}</button>
            ))}
          </div>
        </div>
        <div>
          <span className="text-xs uppercase tracking-wider" style={{ color: C.muted }}>{product.brand}</span>
          <h1 className="text-2xl md:text-3xl font-semibold mt-1" style={{ fontFamily: FONT_DISPLAY, color: C.text }}>{product.name}</h1>
          <div className="flex items-center gap-2 mt-3">
            <Stars value={product.rating} />
            <span className="text-sm" style={{ color: C.muted }}>{product.rating} ({product.reviews} reviews)</span>
          </div>
          <div className="mt-4 text-3xl font-bold" style={{ color: C.brown }}>{naira(product.price)}</div>
          <div className="mt-3 flex items-center gap-2 text-sm" style={{ color: unavailable ? C.danger : C.success }}>
            <span className="w-2 h-2 rounded-full" style={{ background: unavailable ? C.danger : C.success }} />
            {product.isComingSoon ? "Coming Soon" : unavailable ? "OUT OF STOCK" : `In Stock (${product.stock} available)`}
          </div>
          <p className="mt-5 text-sm leading-relaxed" style={{ color: C.muted }}>{product.description}</p>

          {product.storageOptions && (
            <div className="mt-5">
              <h4 className="text-xs uppercase tracking-wider mb-2" style={{ color: C.muted }}>Storage</h4>
              <div className="flex gap-2 flex-wrap">
                {product.storageOptions.map((s) => (
                  <button key={s} onClick={() => setStorageChoice(s)} className="px-4 py-2 text-sm rounded-xl" style={storageChoice === s ? { background: C.brown, color: "#fff" } : { border: `1px solid ${C.border}`, color: C.text }}>{s}</button>
                ))}
              </div>
            </div>
          )}
          {product.colorOptions && (
            <div className="mt-4">
              <h4 className="text-xs uppercase tracking-wider mb-2" style={{ color: C.muted }}>Colour</h4>
              <div className="flex gap-2 flex-wrap">
                {product.colorOptions.map((c) => (
                  <button key={c} onClick={() => setColorChoice(c)} className="px-4 py-2 text-sm rounded-xl" style={colorChoice === c ? { background: C.brown, color: "#fff" } : { border: `1px solid ${C.border}`, color: C.text }}>{c}</button>
                ))}
              </div>
            </div>
          )}

          <div className="mt-6 flex items-center gap-4">
            <div className="flex items-center rounded-xl" style={{ border: `1px solid ${C.border}` }}>
              <button onClick={() => setQty((q) => Math.max(1, q - 1))} className="p-3"><Minus size={14} style={{ color: C.text }} /></button>
              <span className="px-4 text-sm" style={{ color: C.text }}>{qty}</span>
              <button onClick={() => setQty((q) => Math.min(product.stock || 1, q + 1))} className="p-3"><Plus size={14} style={{ color: C.text }} /></button>
            </div>
            <button onClick={() => toggleWishlist(product.id)} className="p-3 rounded-xl" style={{ border: `1px solid ${C.border}` }}>
              <Heart size={16} style={{ color: wishlist.has(product.id) ? C.brown : C.text }} fill={wishlist.has(product.id) ? C.brown : "none"} />
            </button>
          </div>

          <div className="mt-6 flex flex-col sm:flex-row gap-3">
            <Button variant="outline" className="flex-1" icon={ShoppingCart} disabled={unavailable} onClick={() => addToCart(product.id, qty)}>{unavailable ? "Out of Stock" : "Add to Cart"}</Button>
            <Button className="flex-1" disabled={unavailable} onClick={() => onBuyNow(product.id, qty)}>Buy Now</Button>
          </div>

          <div className="mt-8">
            <h3 className="text-sm uppercase tracking-wider mb-3" style={{ color: C.brown }}>Specifications</h3>
            <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.border}` }}>
              {Object.entries(product.specs).map(([k, v], i) => (
                <div key={k} className="flex justify-between px-4 py-3 text-sm" style={{ borderTop: i ? `1px solid ${C.border}` : "none", background: i % 2 ? C.surfaceAlt : C.surface }}>
                  <span style={{ color: C.muted }}>{k}</span><span style={{ color: C.text }}>{v}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="mt-8">
            <h3 className="text-sm uppercase tracking-wider mb-3" style={{ color: C.brown }}>Customer Reviews</h3>
            <div className="space-y-3">
              {REVIEWS_SAMPLE.map((r) => (
                <div key={r.name} className="p-4 rounded-xl" style={{ background: C.surfaceAlt }}>
                  <div className="flex items-center justify-between"><span className="text-sm font-semibold" style={{ color: C.text }}>{r.name}</span><Stars value={r.rating} size={12} /></div>
                  <p className="mt-1 text-sm" style={{ color: C.muted }}>{r.comment}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {related.length > 0 && (
        <div className="mt-16">
          <SectionHeading eyebrow="You may also like" title="Related Products" />
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
            {related.map((p) => <ProductCard key={p.id} product={p} onView={viewProduct} onAdd={(id) => addToCart(id, 1)} wishlist={wishlist} toggleWishlist={toggleWishlist} />)}
          </div>
        </div>
      )}
    </div>
  );
}

function CartPage({ cart, updateQty, removeItem, setView }) {
  const lines = cart.map((c) => ({ ...c, product: PRODUCTS.find((p) => p.id === c.id) })).filter((l) => l.product);
  const subtotal = lines.reduce((s, l) => s + l.product.price * l.qty, 0);
  const shipping = subtotal === 0 ? 0 : subtotal > 800000 ? 0 : 4500;
  const total = subtotal + shipping;

  if (lines.length === 0) {
    return (
      <div className="max-w-2xl mx-auto px-4 py-24 text-center">
        <ShoppingCart size={40} style={{ color: C.brown }} className="mx-auto" />
        <h2 className="mt-4 text-xl font-semibold" style={{ fontFamily: FONT_DISPLAY, color: C.text }}>Your cart is empty</h2>
        <p className="mt-2 text-sm" style={{ color: C.muted }}>Browse the catalog and find something worth carrying home.</p>
        <div className="mt-6 flex justify-center"><Button onClick={() => setView("shop")} icon={ArrowRight}>Go to Shop</Button></div>
      </div>
    );

  return (
    <div className="max-w-6xl mx-auto px-4 md:px-8 py-10">
      <SectionHeading eyebrow="Cart" title="Your Bag" sub={`${lines.length} item${lines.length > 1 ? "s" : ""}`} />
      <div className="grid md:grid-cols-3 gap-10">
        <div className="md:col-span-2 space-y-4">
          {lines.map((l) => (
            <div key={l.id} className="flex gap-4 p-4 rounded-2xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
              <div className="w-24 shrink-0"><ProductArt product={l.product} /></div>
              <div className="flex-1 flex flex-col justify-between">
                <div><span className="text-xs uppercase tracking-wider" style={{ color: C.muted }}>{l.product.brand}</span><h3 className="text-sm md:text-base font-medium" style={{ color: C.text }}>{l.product.name}</h3></div>
                <div className="flex items-center justify-between mt-2">
                  <div className="flex items-center rounded-xl" style={{ border: `1px solid ${C.border}` }}>
                    <button onClick={() => updateQty(l.id, Math.max(1, l.qty - 1))} className="p-2"><Minus size={12} style={{ color: C.text }} /></button>
                    <span className="px-3 text-sm" style={{ color: C.text }}>{l.qty}</span>
                    <button onClick={() => updateQty(l.id, l.qty + 1)} className="p-2"><Plus size={12} style={{ color: C.text }} /></button>
                  </div>
                  <span className="text-sm font-bold" style={{ color: C.brown }}>{naira(l.product.price * l.qty)}</span>
                </div>
              </div>
              <button onClick={() => removeItem(l.id)}><Trash2 size={16} style={{ color: C.muted }} /></button>
            </div>
          ))}
        </div>
        <div className="p-6 h-fit rounded-2xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <h3 className="text-sm uppercase tracking-wider mb-4" style={{ color: C.brown }}>Order Summary</h3>
          <div className="space-y-2 text-sm">
            <div className="flex justify-between" style={{ color: C.muted }}><span>Subtotal</span><span>{naira(subtotal)}</span></div>
            <div className="flex justify-between" style={{ color: C.muted }}><span>Shipping Fee</span><span>{shipping === 0 ? "Free" : naira(shipping)}</span></div>
          </div>
          <div className="flex justify-between mt-4 pt-4 text-base font-semibold" style={{ borderTop: `1px solid ${C.border}`, color: C.text }}>
            <span>Grand Total</span><span style={{ color: C.brown }}>{naira(total)}</span>
          </div>
          <Button className="w-full mt-6" fullWidth onClick={() => setView("checkout")} icon={ArrowRight}>Proceed to Checkout</Button>
        </div>
      </div>
    </div>
  );
}

function CheckoutPage({ cart, setView, clearCart, placeOrder }) {

          <div>
            <h3 className="text-sm uppercase tracking-wider mb-3" style={{ color: C.brown }}>Contact</h3>
            <div className="grid sm:grid-cols-2 gap-4">
              <Input label="Full Name" required value={form.fullName} onChange={(e) => update("fullName", e.target.value)} />
              <Input label="Phone Number" required value={form.phone} onChange={(e) => update("phone", e.target.value)} />

            <h3 className="text-sm uppercase tracking-wider mb-3" style={{ color: C.brown }}>Delivery Address</h3>

          <div>
            <h3 className="text-sm uppercase tracking-wider mb-3" style={{ color: C.brown }}>Payment Method</h3>
            <div className="grid sm:grid-cols-2 gap-4">

                <button key={m} type="button" onClick={() => update("method", m)} className="p-4 text-left text-sm capitalize rounded-xl" style={{ border: `1px solid ${form.method === m ? C.brown : C.border}`, color: form.method === m ? C.brown : C.text }}>
                  {m} <span className="block text-xs mt-1" style={{ color: C.muted }}>Debit Card · Bank Transfer · USSD</span>
                </button>
              ))}
            </div>
          </div>
        </div>
        <div className="p-6 h-fit rounded-2xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <h3 className="text-sm uppercase tracking-wider mb-4" style={{ color: C.brown }}>Order Summary</h3>
          <div className="space-y-3 max-h-48 overflow-y-auto pr-1">
            {lines.map((l) => <div key={l.id} className="flex justify-between text-sm"><span style={{ color: C.muted }}>{l.product.name} × {l.qty}</span><span style={{ color: C.text }}>{naira(l.product.price * l.qty)}</span></div>)}
          </div>
          <div className="space-y-2 text-sm mt-4 pt-4" style={{ borderTop: `1px solid ${C.border}` }}>
            <div className="flex justify-between" style={{ color: C.muted }}><span>Shipping</span><span>{shipping === 0 ? "Free" : naira(shipping)}</span></div>
          </div>
          <div className="flex justify-between mt-3 pt-3 text-base font-semibold" style={{ borderTop: `1px solid ${C.border}`, color: C.text }}>
            <span>Grand Total</span><span style={{ color: C.brown }}>{naira(total)}</span>
          </div>
          <Button type="submit" fullWidth className="mt-6" disabled={lines.length === 0}>Place Order</Button>
        </div>
      </form>
    </div>
  );
}

    { id: "products", label: "Products", icon: Package },
    { id: "orders", label: "Orders", icon: ShoppingCart },
    { id: "customers", label: "Customers", icon: Users },
    { id: "requests", label: "Requests", icon: MessageCircle },
  ];

  const statusFlow = ["Pending", "Processing", "Shipped", "Delivered"];

  return (
    <div className="min-h-screen flex" style={{ background: C.bg }}>
      <aside className="hidden md:flex flex-col w-60 shrink-0 p-5" style={{ background: C.brownDark }}>
        <Logo light onClick={() => setView("home")} />
        <nav className="mt-8 space-y-1">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm" style={{ background: tab === t.id ? "rgba(255,255,255,0.12)" : "transparent", color: "#fff" }}>
              <t.icon size={16} /> {t.label}
            </button>
          ))}
        </nav>
        <button onClick={() => setView("home")} className="mt-auto flex items-center gap-2 text-xs" style={{ color: "#EAD9C4" }}><ArrowLeft size={14} /> Exit to storefront</button>
      </aside>

      <main className="flex-1 p-6 md:p-10 overflow-y-auto">
        <h1 className="text-2xl font-semibold mb-6" style={{ fontFamily: FONT_DISPLAY, color: C.text }}>
          {tabs.find((t) => t.id === tab)?.label}
        </h1>

        {tab === "overview" && (
          <>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
              {[
                { label: "Total Products", value: PRODUCTS.length, icon: Package },
                { label: "Total Orders", value: orders.length, icon: ShoppingCart },
                { label: "Total Customers", value: 642, icon: Users },
                { label: "Revenue", value: naira(revenue), icon: TrendingUp },
              ].map((s) => (
                <div key={s.label} className="p-5 rounded-2xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                  <s.icon size={20} style={{ color: C.brown }} />
                  <div className="text-2xl font-bold mt-3" style={{ color: C.text }}>{s.value}</div>
                  <div className="text-xs mt-1" style={{ color: C.muted }}>{s.label}</div>
                </div>
              ))}
            </div>
            {outOfStock.length > 0 && (
              <div className="mb-8 p-4 rounded-xl flex items-center gap-3" style={{ background: "#FBEAE7", border: `1px solid ${C.danger}33` }}>
                <XCircle size={18} style={{ color: C.danger }} />
                <span className="text-sm" style={{ color: C.danger }}>{outOfStock.length} product(s) out of stock — {lowStock} more running low.</span>
              </div>
            )}
            <h3 className="text-sm uppercase tracking-wider mb-3" style={{ color: C.brown }}>Recent Orders</h3>
            <div className="space-y-3">
              {orders.slice(0, 5).map((o) => (
                <div key={o.id} className="p-4 rounded-xl flex justify-between items-center" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                  <div><span className="text-sm font-semibold" style={{ color: C.text }}>#{o.id}</span><span className="text-xs ml-2" style={{ color: C.muted }}>{o.customer.fullName}</span></div>
                  <span className="text-sm font-bold" style={{ color: C.brown }}>{naira(o.total)}</span>
                </div>
              ))}
              {orders.length === 0 && <p className="text-sm" style={{ color: C.muted }}>No orders placed yet — they'll appear here immediately when a customer checks out.</p>}
            </div>
          </>
        )}

        {tab === "products" && (
          <div className="space-y-3">
            <Button icon={Plus} className="mb-4">Add Product</Button>
            {PRODUCTS.slice(0, 30).map((p) => (
              <div key={p.id} className="p-4 rounded-xl flex items-center gap-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="w-14 h-14 shrink-0"><ProductArt product={p} /></div>
                <div className="flex-1">
                  <div className="text-sm font-semibold" style={{ color: C.text }}>{p.name}</div>
                  <div className="text-xs" style={{ color: C.muted }}>{naira(p.price)} · Stock: {p.stock} {p.stock === 0 && <span style={{ color: C.danger }}>· OUT OF STOCK</span>}</div>
                </div>
                {p.stock === 0 ? (
                  <button onClick={() => restockProduct(p.id)} className="text-xs px-3 py-1.5 rounded-full flex items-center gap-1" style={{ border: `1px solid ${C.success}`, color: C.success }}><ArchiveRestore size={12} /> Restock</button>
                ) : (
                  <button className="text-xs px-3 py-1.5 rounded-full flex items-center gap-1" style={{ border: `1px solid ${C.border}`, color: C.muted }}><Archive size={12} /> Archive</button>
                )}
              </div>
            ))}
            <p className="text-xs text-center pt-2" style={{ color: C.muted }}>Showing 30 of {PRODUCTS.length} products.</p>
          </div>
        )}

        {tab === "orders" && (
          <div className="space-y-4">
            {orders.length === 0 && <p className="text-sm" style={{ color: C.muted }}>No orders yet. Place one from the storefront checkout to see it appear here instantly.</p>}
            {orders.map((o) => (
              <div key={o.id} className="p-5 rounded-2xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="flex flex-wrap justify-between gap-3">
                  <div>
                    <div className="text-sm font-semibold" style={{ color: C.text }}>#{o.id} — {o.customer.fullName}</div>
                    <div className="text-xs mt-1" style={{ color: C.muted }}>{o.customer.phone} · {o.customer.address}, {o.customer.city}, {o.customer.state}</div>
                    <div className="text-xs mt-1" style={{ color: C.muted }}>{o.items.map((i) => `${i.name} ×${i.qty}`).join(", ")}</div>
                  </div>
                  <div className="text-right">
                    <Badge tone={o.status === "Cancelled" ? "danger" : o.status === "Delivered" ? "success" : "warning"}>{o.status}</Badge>
                    <div className="text-sm font-bold mt-2" style={{ color: C.brown }}>{naira(o.total)}</div>
                  </div>
                </div>
                {o.status !== "Cancelled" && o.status !== "Delivered" && (
                  <div className="flex gap-2 mt-4 flex-wrap">
                    {statusFlow[statusFlow.indexOf(o.status) + 1] && (
                      <button onClick={() => advanceOrder(o.id)} className="text-xs px-3 py-1.5 rounded-full flex items-center gap-1" style={{ background: C.brown, color: "#fff" }}>
                        <CheckCircle2 size={12} /> Mark as {statusFlow[statusFlow.indexOf(o.status) + 1]}
                      </button>
                    )}
                    <button onClick={() => cancelOrder(o.id)} className="text-xs px-3 py-1.5 rounded-full flex items-center gap-1" style={{ border: `1px solid ${C.danger}`, color: C.danger }}><XCircle size={12} /> Cancel Order</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}

        {tab === "customers" && (
          <div className="space-y-3">
            {[{ name: "Adaeze Okafor", email: "adaeze@email.com", orders: 4, spend: 2860000 }, { name: "Tunde King", email: "tunde@email.com", orders: 2, spend: 1420000 }, { name: "Ifeoma Bello", email: "ifeoma@email.com", orders: 6, spend: 980000 }].map((c) => (
              <div key={c.email} className="p-4 rounded-xl flex justify-between items-center" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div><div className="text-sm font-semibold" style={{ color: C.text }}>{c.name}</div><div className="text-xs" style={{ color: C.muted }}>{c.email}</div></div>
                <div className="text-right"><div className="text-sm font-bold" style={{ color: C.brown }}>{naira(c.spend)}</div><div className="text-xs" style={{ color: C.muted }}>{c.orders} orders</div></div>
              </div>
            ))}
          </div>
        )}

        {tab === "requests" && (
          <div className="space-y-3">
            {requests.length === 0 && <p className="text-sm" style={{ color: C.muted }}>No device requests yet. Submit one from the Request a Device page to see it here.</p>}
            {requests.map((r) => (
              <div key={r.id} className="p-4 rounded-xl" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
                <div className="flex justify-between"><span className="text-sm font-semibold" style={{ color: C.text }}>{r.deviceName} ({r.brand})</span><Badge tone="warning">New</Badge></div>
                <div className="text-xs mt-1" style={{ color: C.muted }}>{r.fullName} · {r.phone} · {r.email}</div>
                <div className="text-xs mt-1" style={{ color: C.muted }}>{r.storage} · {r.color} · {r.condition}</div>
                {r.notes && <div className="text-xs mt-2 italic" style={{ color: C.muted }}>"{r.notes}"</div>}
              </div>
            ))}
          </div>
        )}
      </main>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  TOAST                                                                  */
/* ---------------------------------------------------------------------- */
function Toast({ message }) {
  if (!message) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 text-sm flex items-center gap-2 rounded-full" style={{ background: C.brown, color: "#fff", fontWeight: 600 }}>
      <Check size={16} /> {message}
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  ROOT APP                                                               */
/* ---------------------------------------------------------------------- */
function App() {
  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap";
    document.head.appendChild(link);
    return () => document.head.removeChild(link);
  }, []);

  const [view, setViewRaw] = useState("welcome");
  const [productId, setProductId] = useState(null);
  const [categoryFilter, setCategoryFilter] = useState(null);
  const [cart, setCart] = useState([]);
  const [wishlist, setWishlist] = useState(new Set());
  const [orders, setOrders] = useState([]);
  const [requests, setRequests] = useState([]);
  const [toast, setToast] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);

  const setView = (v, cat) => { setViewRaw(v); if (cat !== undefined) setCategoryFilter(cat); window.scrollTo(0, 0); };

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2000); return () => clearTimeout(t); }, [toast]);
  const showToast = (m) => setToast(m);

  const addToCart = (id, qty = 1) => {
    const product = PRODUCTS.find((p) => p.id === id);
    if (product && product.stock === 0) { showToast("Out of stock"); return; }
    setCart((prev) => { const existing = prev.find((c) => c.id === id); if (existing) return prev.map((c) => c.id === id ? { ...c, qty: c.qty + qty } : c); return [...prev, { id, qty }]; });
    showToast("Added to cart");
  };
  const buyNow = (id, qty = 1) => { addToCart(id, qty); setView("checkout"); };
  const updateQty = (id, qty) => setCart((prev) => prev.map((c) => c.id === id ? { ...c, qty } : c));
  const removeItem = (id) => setCart((prev) => prev.filter((c) => c.id !== id));
  const clearCart = () => setCart([]);
  const viewProduct = (id) => { setProductId(id); setView("product"); };
  const toggleWishlist = (id) => setWishlist((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const placeOrder = (form, lines, total) => {
    const id = "YPG" + Math.floor(1000 + Math.random() * 9000);
    const newOrder = {
      id, status: "Pending", total, date: new Date().toLocaleDateString(),
      customer: form, items: lines.map((l) => ({ name: l.product.name, qty: l.qty, productId: l.product.id })),
    };
    setOrders((prev) => [newOrder, ...prev]);
    lines.forEach((l) => { const p = PRODUCTS.find((pp) => pp.id === l.product.id); if (p) p.stock = Math.max(0, p.stock - l.qty); });
  };
  const advanceOrder = (id) => setOrders((prev) => prev.map((o) => {
    if (o.id !== id) return o;
    const flow = ["Pending", "Processing", "Shipped", "Delivered"];
    const next = flow[flow.indexOf(o.status) + 1] || o.status;
    return { ...o, status: next };
  }));
  const cancelOrder = (id) => setOrders((prev) => prev.map((o) => o.id === id ? { ...o, status: "Cancelled" } : o));
  const restockProduct = (id) => { const p = PRODUCTS.find((pp) => pp.id === id); if (p) p.stock = 25; showToast("Product restocked"); };
  const submitRequest = (form) => setRequests((prev) => [{ id: Date.now(), ...form }, ...prev]);

  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  if (view === "welcome") return <WelcomePage setView={setView} />;
  if (view === "login") return <LoginPage setView={setView} onAuth={(u) => { setCurrentUser(u); setView("home"); }} />;
  if (view === "signup") return <SignupPage setView={setView} onAuth={(u) => { setCurrentUser(u); setView("home"); }} />;
  if (view === "adminLogin") return <AdminLoginPage setView={setView} onAdminAuth={() => setView("admin")} />;
  if (view === "admin") return <AdminDashboard orders={orders} requests={requests} setView={setView} advanceOrder={advanceOrder} cancelOrder={cancelOrder} restockProduct={restockProduct} />;

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: FONT_BODY }}>
      <Navbar view={view} setView={setView} cartCount={cartCount} wishCount={wishlist.size} search="" setSearch={() => {}} currentUser={currentUser} />
      {view === "home" && <HomePage setView={setView} viewProduct={viewProduct} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist} />}
      {view === "shop" && <ShopPage initialCategory={categoryFilter} viewProduct={viewProduct} addToCart={addToCart} wishlist={wishlist} toggleWishlist={toggleWishlist} />}
      {view === "product" && <ProductPage productId={productId} viewProduct={viewProduct} addToCart={addToCart} onBuyNow={buyNow} wishlist={wishlist} toggleWishlist={toggleWishlist} />}
      {view === "cart" && <CartPage cart={cart} updateQty={updateQty} removeItem={removeItem} setView={setView} />}
      {view === "checkout" && <CheckoutPage cart={cart} setView={setView} clearCart={clearCart} placeOrder={placeOrder} />}
      {view === "request" && <RequestDevicePage submitRequest={submitRequest} />}
      {view === "wishlist" && <WishlistPage wishlist={wishlist} toggleWishlist={toggleWishlist} viewProduct={viewProduct} addToCart={addToCart} setView={setView} />}
      {view === "orders" && <OrdersPage orders={orders} setView={setView} />}
      <Footer setView={setView} />
      <WhatsAppButton />
      <Toast message={toast} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
